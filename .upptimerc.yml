# QWED status: https://status.qwedai.tech
# Upptime checks each service from GitHub Actions on a 5-minute schedule
# (GitHub often starts a run a few minutes late). When one stops answering,
# it opens an issue in this repository, and the issue closes itself when the
# service is back. See https://upptime.js.org/docs/configuration
owner: QWED-AI
repo: status

# Each site's icon is our own favicon, so the status page doesn't ask a
# third-party icon service (by default Upptime fetches icons from DuckDuckGo).
sites:
  # QWED Security, the GitHub App that checks pull requests (Google Cloud Run).
  - name: QWED Security
    url: https://qwed-security-334760594829.us-central1.run.app/health
    icon: https://qwedai.tech/favicon.svg
  # Its public signing keys, which anyone verifying a signed record fetches.
  - name: QWED Security signing keys
    url: https://qwed-security-334760594829.us-central1.run.app/.well-known/jwks.json
    icon: https://qwedai.tech/favicon.svg
  - name: qwedai.tech
    url: https://qwedai.tech
    icon: https://qwedai.tech/favicon.svg
  - name: Documentation
    url: https://docs.qwedai.tech
    icon: https://qwedai.tech/favicon.svg
  - name: Dashboard preview
    url: https://demo.qwedai.tech
    icon: https://qwedai.tech/favicon.svg

# Who is assigned a new incident.
assignees:
  - rahuldass19

status-website:
  cname: status.qwedai.tech
  logoUrl: https://qwedai.tech/favicon.svg
  # Our own theme (assets/qwed.css): qwedai.tech colours and Geist, light or dark by system setting.
  themeUrl: https://status.qwedai.tech/qwed.css
  favicon: https://qwedai.tech/apple-touch-icon.png
  faviconSvg: https://qwedai.tech/favicon.svg
  name: QWED status
  introTitle: "Status of QWED Security and the qwedai.tech sites"
  introMessage: Each service is checked on a 5-minute schedule; GitHub often starts a check a few minutes late. When one stops answering, an incident opens here and closes when it is back. QWED Security is the GitHub App that checks pull requests; the others are this website, its documentation and the dashboard preview.
  navbar:
    - title: Status
      href: /
    - title: qwedai.tech
      href: https://qwedai.tech
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
